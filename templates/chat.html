<!DOCTYPE html>
<html>

<head>
    <title>MiniMart Chat Test</title>
</head>

<body>
    <h2>MiniMart Chat Test</h2>
    <div>
        <label>Token:</label><br>
        <textarea id="token" rows="3" cols="60" placeholder="Paste JWT token here"></textarea><br><br>
        <label>List ID:</label><br>
        <input type="text" id="listId" placeholder="Shopping List UUID" style="width: 400px;"><br><br>
        <button id="connectBtn" onclick="toggleConnection()">Connect</button>
    </div>
    <p id="status">Status: Disconnected</p>
    <hr>
    <div id="messages"
        style="height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px;"></div>
    <div>
        <input type="text" id="msgInput" placeholder="Message..." disabled style="width: 400px;">
        <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
    </div>

    <script>
        var currentWs = null;
        var connectionId = 0;

        function log(text) {
            var el = document.getElementById('messages');
            var p = document.createElement('p');
            p.textContent = new Date().toLocaleTimeString() + ' - ' + text;
            el.appendChild(p);
            el.scrollTop = el.scrollHeight;
        }

        function toggleConnection() {
            if (currentWs) {
                currentWs.close();
                currentWs = null;
                return;
            }

            var token = document.getElementById('token').value.trim();
            var lid = document.getElementById('listId').value.trim();
            if (!token) { alert('Paste a token'); return; }
            if (!lid) { alert('Enter a List ID'); return; }

            connectionId++;
            var myId = connectionId;
            var url = 'ws://localhost:8000/ws/shopping-lists/' + lid + '/chat?token=' + token;
            log('Connecting...');

            var ws = new WebSocket(url);
            currentWs = ws;

            ws.onopen = function () {
                if (myId !== connectionId) { ws.close(); return; }
                document.getElementById('status').innerText = 'Status: Connected';
                document.getElementById('connectBtn').innerText = 'Disconnect';
                document.getElementById('msgInput').disabled = false;
                document.getElementById('sendBtn').disabled = false;
                log('Connected!');
            };

            ws.onmessage = function (event) {
                if (myId !== connectionId) return;
                try {
                    var data = JSON.parse(event.data);
                    if (data.type === 'chat_message') {
                        log(data.sender_name + ': ' + data.message);
                    } else if (data.type === 'connected') {
                        log('Joined chat room for list: ' + (data.payload.list_id || ''));
                    } else if (data.type === 'error') {
                        log('ERROR: ' + (data.payload.message || JSON.stringify(data)));
                    } else if (data.type === 'pong') {
                        // ignore
                    } else {
                        log('[' + data.type + '] ' + JSON.stringify(data.payload || data));
                    }
                } catch (e) {
                    log('Parse error: ' + e.message);
                }
            };

            ws.onclose = function (event) {
                if (myId !== connectionId) return;
                currentWs = null;
                document.getElementById('status').innerText = 'Status: Disconnected (code=' + event.code + ')';
                document.getElementById('connectBtn').innerText = 'Connect';
                document.getElementById('msgInput').disabled = true;
                document.getElementById('sendBtn').disabled = true;
                log('Disconnected: code=' + event.code + ' reason=' + (event.reason || 'none'));
            };

            ws.onerror = function () {
                if (myId !== connectionId) return;
                log('WebSocket error - check browser console (F12)');
            };
        }

        function sendMessage() {
            var input = document.getElementById('msgInput');
            var msg = input.value.trim();
            if (msg && currentWs && currentWs.readyState === 1) {
                currentWs.send(JSON.stringify({ type: 'chat_message', message: msg }));
                input.value = '';
            }
        }

        document.getElementById('msgInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>

</html>
