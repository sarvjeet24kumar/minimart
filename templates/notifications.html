<!DOCTYPE html>
<html>

<head>
    <title>MiniMart Notification Test</title>
</head>

<body>
    <h2>MiniMart Notification Monitor</h2>
    <div>
        <label>Token:</label><br>
        <textarea id="token" rows="3" cols="60" placeholder="Paste JWT token here"></textarea><br><br>
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
    </div>
    <p id="status">Status: Disconnected</p>
    <hr>
    <h3>Live Notifications:</h3>
    <div id="log"></div>

    <script>
        var ws = null;
        var heartbeat = null;

        function logToUI(text) {
            var el = document.getElementById('log');
            var div = document.createElement('div');
            div.style.borderBottom = '1px solid #ccc';
            div.style.padding = '5px';
            div.style.marginBottom = '5px';

            if (typeof text === 'object') {
                div.innerHTML = '<pre>' + JSON.stringify(text, null, 2) + '</pre>';
            } else {
                div.textContent = text;
            }
            el.insertBefore(div, el.firstChild);
        }

        function connect() {
            if (ws) { ws.close(); ws = null; }
            if (heartbeat) { clearInterval(heartbeat); heartbeat = null; }

            var token = document.getElementById('token').value.trim();
            if (!token) { alert('Paste a token'); return; }

            var url = 'ws://localhost:8000/ws?token=' + token;
            logToUI('Connecting...');

            ws = new WebSocket(url);

            ws.onopen = function () {
                document.getElementById('status').innerText = 'Status: Connected';
                logToUI('Connected!');

                heartbeat = setInterval(function () {
                    if (ws && ws.readyState === 1) {
                        ws.send(JSON.stringify({ type: 'ping' }));
                    }
                }, 30000);
            };

            ws.onmessage = function (event) {
                var data = JSON.parse(event.data);
                if (data.type === 'pong') return;

                if (data.type === 'notification') {
                    logToUI(data.payload);
                } else if (data.type === 'error') {
                    logToUI('ERROR: ' + JSON.stringify(data.payload));
                } else {
                    logToUI(data);
                }
            };

            ws.onclose = function (event) {
                document.getElementById('status').innerText = 'Status: Disconnected (code=' + event.code + ')';
                logToUI('Disconnected: code=' + event.code + ' reason=' + (event.reason || 'none'));
                if (heartbeat) { clearInterval(heartbeat); heartbeat = null; }
                ws = null;
            };

            ws.onerror = function () {
                logToUI('WebSocket error - check browser console (F12)');
            };
        }

        function disconnect() {
            if (ws) { ws.close(); ws = null; }
        }
    </script>
</body>

</html>
