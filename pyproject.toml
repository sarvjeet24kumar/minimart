[project]
name = "minimart"
version = "1.0.0"
description = "Multi-tenant shopping list application with real-time synchronization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.4",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "sqlalchemy[asyncio]>=2.0.46",
    "asyncpg>=0.30.0",
    "alembic>=1.15.1",
    "redis>=5.2.1",
    "python-jose[cryptography]>=3.4.0",
    "argon2-cffi>=25.1.0",
    "aiosmtplib>=3.0.3",
    "email-validator>=2.2.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.8.1",
    "python-dotenv>=1.1.0",
    "uuid6>=2024.2.25",
    "celery>=5.6.2",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
